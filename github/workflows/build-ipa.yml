name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies & Build iOS
        run: |
          flutter pub get
          flutter build ios --release --no-codesign || true

      - name: Package IPA
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          echo "Found: $APP_PATH"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          zip -ry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: app-unsigned.ipa
